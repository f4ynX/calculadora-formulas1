<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Fórmulas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="cartao">
    <h1>Calculadora de Fórmulas</h1>
    <p class="subtitulo">Escolha uma fórmula e preencha os valores</p>

    <label for="seletor-formula">Fórmula</label>
    <select id="seletor-formula"></select>

    <div id="campos-dinamicos"></div>

    <button id="botao-calcular">Calcular</button>

    <div id="resultado" class="resultado"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
